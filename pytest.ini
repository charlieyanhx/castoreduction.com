[pytest]
# A crashed background thread must FAIL the suite, not add a line to a warning summary.
#
# jobs.run_async generates every report on a daemon thread, and the pipeline fans steps out
# across ThreadPoolExecutors. A worker that dies mid-run cannot fail a test that is only
# asserting on job state — so the suite stays green while the thing under test is broken.
# That happened for real: `_run_one` was refactored to return its outcome, kept publishing
# it, and returned None; every worker then died on `update(job_id, **None)` AFTER the state
# had been written. 1769 tests passed. The only signal was the warning COUNT going 6 -> 27.
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
