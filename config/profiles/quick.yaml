# config/profiles/quick.yaml
# Faster, cheaper. PIPELINE_PROFILE=quick selects this.
# Cuts panel sizes, max_tokens, retries — for dev iteration / smoke testing.

pipeline:
  step_timeout_s: 60
  step_retry_timeout_s: 120
  max_pool_workers_main: 6

discover:
  max_candidates: 10
  cluster_max_workers: 3

differentiators:
  per_dimension_max_tokens: 1000
  backstop_max_tokens: 800
  parallel_workers: 5

customer_universe:
  target_count: 15
  method_d_timeout_s: 15
  method_e_timeout_s: 10
  icp_max_tokens: 1000
  segment_label_max_tokens: 1500

taste:
  trustpilot_pages: 2
  reddit_limit: 15
  hackernews_limit: 8
  articles_limit: 4
  min_total_signals: 5
  min_reviews_or_reddit: [3, 5]
  max_tokens: 1500

reddit:
  max_threads: 5
  days_back: 90
  fetch_timeout_s: 60

max_diff:
  panel_size: 20
  max_tokens: 2500
psm:
  panel_size: 25
  max_tokens: 2000

market_sizing:
  per_layer_max_tokens: 3000
  parallel_workers: 6
  retry_on_thin: false

four_ps:
  per_section_max_tokens: 1500
  parallel_workers: 4

viability:
  initial_timeout_s: 60
  retry_timeout_s: 120
  max_tokens: 3000

segment_scoring:
  per_segment_max_tokens: 800
  parallel_workers: 4

narration:
  default_mode: template       # zero LLM calls — fastest
  llm_max_tokens: 1000

validation:
  audience_low_threshold: 0.3
  audience_med_threshold: 0.5
  audience_high_threshold: 0.7
  min_voice_sources_for_no_flag: 3
  min_competitors_for_no_flag: 3
