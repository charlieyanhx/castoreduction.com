<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Set a new password · Castor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="/brand.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--brand-sans); background: var(--brand-paper);
         color: var(--brand-ink); font-size: 15px; line-height: 1.55;
         -webkit-font-smoothing: antialiased;
         min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  :focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; }
  .card { width: 100%; max-width: 400px; background: var(--brand-surface);
          border: 1px solid var(--brand-line); border-radius: var(--brand-r-lg);
          box-shadow: var(--brand-shadow); padding: 30px 28px 26px; }
  .mark { display: flex; justify-content: center; margin-bottom: 22px; }
  h1 { font-size: 24px; font-weight: 900; letter-spacing: -.02em; margin-bottom: 6px; }
  p.lede { color: var(--brand-ink-dim); font-size: 14px; margin-bottom: 20px; }
  label { display: block; font-size: 12.5px; font-weight: 600;
          color: var(--brand-ink-dim); margin-bottom: 5px; }
  input { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px;
          border-radius: var(--brand-r-sm); border: 1px solid var(--brand-line);
          background: var(--brand-paper); color: var(--brand-ink); }
  input:focus { outline: none; border-color: var(--brand-accent);
                box-shadow: 0 0 0 3px var(--brand-accent-bg); }
  .hint { font-size: 12.5px; color: var(--brand-ink-faint); margin-top: 5px; }
  button { width: 100%; margin-top: 18px; font: inherit; font-size: 15px;
           font-weight: 700; cursor: pointer; padding: 11px; border: 0;
           border-radius: var(--brand-r-sm); background: var(--brand-accent);
           color: #fff; }
  button:hover { opacity: .93; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 14px; font-size: 13.5px; }
  .msg.err { color: var(--brand-danger); }
  .msg.ok { color: var(--brand-ok); }
  .alt { margin-top: 18px; text-align: center; font-size: 13.5px;
         color: var(--brand-ink-dim); }
  .alt a { color: var(--brand-accent-ink); font-weight: 600; }
</style>
</head>
<body>
<main class="card">
  <div class="mark">
    <span class="brand-mark"><span class="beaver" aria-hidden="true">&#129707;</span>
      <span>Castor</span><span class="sub">Research</span></span>
  </div>

  <div id="form">
    <h1>Set a new password</h1>
    <p class="lede">Choose something you have not used elsewhere.</p>
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" autofocus>
    <p class="hint">At least 12 characters.</p>
    <button id="go">Set password and sign in</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="noToken" hidden>
    <h1>That link is not valid</h1>
    <p class="lede">Reset links work once and expire after an hour. Ask for a new one and
      it will arrive in a moment.</p>
    <div class="alt"><a href="/login">Back to sign in</a></div>
  </div>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var token = "";
  try { token = new URLSearchParams(location.search).get("token") || ""; } catch (e) {}

  if (!token) { $("form").hidden = true; $("noToken").hidden = false; return; }

  function submit() {
    var msg = $("msg"); msg.className = "msg"; msg.textContent = "";
    var pw = $("pw").value;
    if (pw.length < 12) {
      msg.className = "msg err";
      msg.textContent = "That is under 12 characters.";
      return;
    }
    $("go").disabled = true;
    fetch("/auth/reset", {method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({token: token, password: pw})})
      .then(function (r) { return r.json().then(function (d) { return {ok: r.ok, d: d}; }); })
      .then(function (x) {
        if (x.ok) {
          msg.className = "msg ok";
          msg.textContent = "Done. Taking you in…";
          // /auth/reset signs them in, so there is nowhere to send them but home.
          setTimeout(function () { location.href = "/home"; }, 700);
          return;
        }
        $("go").disabled = false;
        msg.className = "msg err";
        msg.textContent = (x.d && x.d.detail) || "That did not work.";
      })
      .catch(function () {
        $("go").disabled = false;
        msg.className = "msg err";
        msg.textContent = "Could not reach the server.";
      });
  }

  $("go").addEventListener("click", submit);
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
})();
</script>
</body>
</html>
