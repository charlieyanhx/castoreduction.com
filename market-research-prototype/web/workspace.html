<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Castor — Workspace</title>
<style>
  :root {
    --bg: oklch(98% 0.004 270);
    --surface: oklch(100% 0 0);
    --surface-2: oklch(96.5% 0.004 270);
    --line: oklch(91% 0.005 270);
    --text: oklch(22% 0.02 270);
    --text-dim: oklch(52% 0.015 270);
    --text-faint: oklch(66% 0.012 270);
    --accent: oklch(58% 0.20 264);
    --accent-soft: oklch(95% 0.04 264);
    --ok: oklch(60% 0.16 155);
    --warn: oklch(70% 0.16 70);
    --bad: oklch(58% 0.20 25);
    --sidebar: oklch(20% 0.02 270);
    --sidebar-text: oklch(85% 0.01 270);
    --radius: 12px;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    --mono: "SF Mono", ui-monospace, "Cascadia Code", monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans); color: var(--text); background: var(--bg);
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 248px 1fr 1fr; grid-template-rows: 100vh;
    height: 100vh; overflow: hidden;
  }
  .center, .computer, .sidebar { min-height: 0; }   /* allow inner overflow/scroll */
  .convo { min-height: 0; }
  /* ---------- left sidebar ---------- */
  .sidebar {
    background: var(--sidebar); color: var(--sidebar-text);
    display: flex; flex-direction: column; padding: 16px 12px; gap: 4px;
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 6px 8px 16px; font-weight: 700; font-size: 15px; color: #fff; letter-spacing: -0.01em; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .new-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px;
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    font: inherit; font-weight: 600; cursor: pointer; margin-bottom: 14px;
    transition: filter var(--ease) .2s;
  }
  .new-btn:hover { filter: brightness(1.08); }
  .nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: oklch(60% 0.01 270); padding: 8px 8px 4px; }
  .task { display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; border-radius: 8px; cursor: pointer; transition: background var(--ease) .15s; }
  .task:hover { background: oklch(28% 0.02 270); }
  .task.active { background: oklch(31% 0.03 264); }
  .task .t-title { font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task .t-meta { font-size: 11px; color: oklch(62% 0.01 270); display: flex; gap: 6px; align-items: center; }
  .task .t-state { width: 6px; height: 6px; border-radius: 50%; }
  .s-complete { background: var(--ok); } .s-running { background: var(--accent); animation: pulse 1.2s infinite; } .s-error { background: var(--bad); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .task-list { overflow-y: auto; flex: 1; margin-top: 4px; }
  .side-foot { font-size: 11px; color: oklch(55% 0.01 270); padding: 10px 8px 0; border-top: 1px solid oklch(28% 0.02 270); }

  /* ---------- center: conversation ---------- */
  .center { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--surface); overflow: hidden; }
  .center-head { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; }
  .center-head h1 { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .center-head .sub { font-size: 12px; color: var(--text-faint); }
  .convo { flex: 1; overflow-y: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 11px; max-width: 92%; animation: rise .35s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg .av { width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .msg.bot .av { background: var(--accent-soft); color: var(--accent); }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .av { background: var(--surface-2); color: var(--text-dim); }
  .bubble { padding: 11px 14px; border-radius: 13px; font-size: 13.5px; }
  .msg.bot .bubble { background: var(--surface-2); border-bottom-left-radius: 4px; }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .composer { border-top: 1px solid var(--line); padding: 14px 24px 18px; }
  .composer .fields { font-size: 11px; color: var(--text-faint); margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
  .chip.done { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .input-row { display: flex; gap: 8px; }
  .input-row textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; font: inherit; font-size: 13.5px; min-height: 46px; max-height: 140px; outline: none; transition: border-color var(--ease) .2s; }
  .input-row textarea:focus { border-color: var(--accent); }
  .send { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .send:disabled { opacity: .45; cursor: default; }
  .launch { width: 100%; margin-top: 10px; padding: 12px; background: var(--text); color: #fff; border: none; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .launch:disabled { opacity: .4; cursor: default; }

  /* ---------- right: Castor Computer ---------- */
  .computer { display: flex; flex-direction: column; background: var(--surface-2); overflow: hidden; }
  .comp-head { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .comp-head .ico { width: 26px; height: 26px; border-radius: 7px; background: var(--text); color: #fff; display: grid; place-items: center; font-size: 13px; }
  .comp-head .t { font-weight: 600; font-size: 13.5px; } .comp-head .s { font-size: 11.5px; color: var(--text-faint); }
  .comp-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
  .placeholder { height: 100%; display: grid; place-items: center; text-align: center; color: var(--text-faint); font-size: 13px; }
  /* step timeline */
  .step { display: flex; gap: 11px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
  .step .mk { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 11px; margin-top: 1px; }
  .step.done .mk { background: var(--ok); color: #fff; }
  .step.active .mk { background: var(--accent); color: #fff; animation: pulse 1.1s infinite; }
  .step.pending .mk { background: var(--surface); border: 1.5px solid var(--line); color: transparent; }
  .step .lbl { font-size: 13px; } .step.pending .lbl { color: var(--text-faint); }
  .step .det { font-size: 11.5px; color: var(--text-faint); }
  /* report viewer */
  .report-frame { width: 100%; height: 100%; border: none; background: #fff; }
  /* replay scrubber */
  .scrubber { border-top: 1px solid var(--line); padding: 12px 20px; background: var(--surface); display: none; align-items: center; gap: 12px; }
  .scrubber.on { display: flex; }
  .scrubber input[type=range] { flex: 1; accent-color: var(--accent); }
  .scrubber .lbl { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .scrubber button { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; width: 30px; height: 28px; cursor: pointer; font-size: 13px; }
  .live-dot { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--accent); }
  .live-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
  .tabs { display: flex; gap: 6px; }
  .tab { font-size: 11.5px; padding: 4px 10px; border-radius: 7px; cursor: pointer; color: var(--text-dim); }
  .tab.on { background: var(--text); color: #fff; }
</style>
</head>
<body>
  <!-- LEFT -->
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> Castor</div>
    <button class="new-btn" id="newBtn">＋ New report</button>
    <div class="nav-label">Reports</div>
    <div class="task-list" id="taskList"></div>
    <div class="side-foot" id="sideFoot">Triangulated · sourced · reproducible</div>
  </aside>

  <!-- CENTER -->
  <section class="center">
    <div class="center-head">
      <h1 id="centerTitle">New report</h1>
      <span class="sub" id="centerSub">Describe your venture →</span>
    </div>
    <div class="convo" id="convo"></div>
    <div class="composer" id="composer">
      <div class="fields" id="fields"></div>
      <div class="input-row">
        <textarea id="input" placeholder="What does your product do, and who is it for?"></textarea>
        <button class="send" id="sendBtn">Send</button>
      </div>
      <button class="launch" id="launchBtn" disabled>Generate report →</button>
    </div>
  </section>

  <!-- RIGHT: Castor Computer -->
  <section class="computer">
    <div class="comp-head">
      <div class="ico">▣</div>
      <div>
        <div class="t">Castor Computer</div>
        <div class="s" id="compStatus">Idle — start a report to watch it work</div>
      </div>
      <div style="margin-left:auto" class="tabs" id="compTabs"></div>
    </div>
    <div class="comp-body" id="compBody">
      <div class="placeholder">The agent's work appears here as it runs.</div>
    </div>
    <div class="scrubber" id="scrubber">
      <button id="playBtn">▶</button>
      <input type="range" id="scrub" min="0" max="0" value="0" />
      <span class="lbl" id="scrubLbl">step 0 / 0</span>
    </div>
  </section>

  <script src="/workspace.js"></script>
</body>
</html>
