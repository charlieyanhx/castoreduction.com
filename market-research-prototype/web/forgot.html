<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reset your password · Castor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="/brand.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--brand-sans); background: var(--brand-paper);
         color: var(--brand-ink); font-size: 15px; line-height: 1.55;
         -webkit-font-smoothing: antialiased;
         min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  :focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; }
  .card { width: 100%; max-width: 400px; background: var(--brand-surface);
          border: 1px solid var(--brand-line); border-radius: var(--brand-r-lg);
          box-shadow: var(--brand-shadow); padding: 30px 28px 26px; }
  .mark { display: flex; justify-content: center; margin-bottom: 22px; }
  h1 { font-size: 24px; font-weight: 900; letter-spacing: -.02em; margin-bottom: 6px; }
  p.lede { color: var(--brand-ink-dim); font-size: 14px; margin-bottom: 20px; }
  label { display: block; font-size: 12.5px; font-weight: 600;
          color: var(--brand-ink-dim); margin-bottom: 5px; }
  input { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px;
          border-radius: var(--brand-r-sm); border: 1px solid var(--brand-line);
          background: var(--brand-paper); color: var(--brand-ink); }
  input:focus { outline: none; border-color: var(--brand-accent);
                box-shadow: 0 0 0 3px var(--brand-accent-bg); }
  button { width: 100%; margin-top: 18px; font: inherit; font-size: 15px;
           font-weight: 700; cursor: pointer; padding: 11px; border: 0;
           border-radius: var(--brand-r-sm); background: var(--brand-accent); color: #fff; }
  button:hover { opacity: .93; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 16px; font-size: 13.5px; color: var(--brand-ink-dim); }
  .alt { margin-top: 18px; text-align: center; font-size: 13.5px;
         color: var(--brand-ink-dim); }
  .alt a { color: var(--brand-accent-ink); font-weight: 600; }
</style>
</head>
<body>
<main class="card">
  <div class="mark">
    <a class="brand-mark" href="/home"><svg viewBox="0 0 100 100" width="32" height="32"><g transform="translate(10,8)"><ellipse cx="40" cy="38" rx="38" ry="35" fill="#B07840"/><ellipse cx="40" cy="46" rx="28" ry="24" fill="#D4A870"/><circle cx="28" cy="30" r="5.5" fill="#2B3C2B"/><circle cx="29.5" cy="28.5" r="2" fill="white"/><circle cx="52" cy="30" r="5.5" fill="#2B3C2B"/><circle cx="53.5" cy="28.5" r="2" fill="white"/><ellipse cx="40" cy="42" rx="6" ry="4.5" fill="#2B3C2B"/><path d="M35 48 Q40 54 45 48" stroke="#2B3C2B" stroke-width="2" fill="none" stroke-linecap="round"/><line x1="4" y1="38" x2="22" y2="42" stroke="#2B3C2B" stroke-width="1.8" stroke-linecap="round"/><line x1="2" y1="46" x2="20" y2="46" stroke="#2B3C2B" stroke-width="1.8" stroke-linecap="round"/><line x1="4" y1="54" x2="22" y2="50" stroke="#2B3C2B" stroke-width="1.8" stroke-linecap="round"/><line x1="76" y1="38" x2="58" y2="42" stroke="#2B3C2B" stroke-width="1.8" stroke-linecap="round"/><line x1="78" y1="46" x2="60" y2="46" stroke="#2B3C2B" stroke-width="1.8" stroke-linecap="round"/><line x1="76" y1="54" x2="58" y2="50" stroke="#2B3C2B" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="12" cy="12" rx="9" ry="8" fill="#B07840"/><ellipse cx="68" cy="12" rx="9" ry="8" fill="#B07840"/></g></svg><div><span class="word">Castor</span><span class="sub">Research</span></div></a>
  </div>
  <h1>Reset your password</h1>
  <p class="lede">We will send a link to your address. It works once and expires in an hour.</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" autofocus>
  <button id="go">Send the link</button>
  <!-- The message never says whether the address is registered: a distinct answer would
       turn this form into a way to test an address list. -->
  <div class="msg" id="msg"></div>
  <div class="alt"><a href="/login">Back to sign in</a></div>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function submit() {
    var email = ($("email").value || "").trim();
    if (!email) return;
    $("go").disabled = true;
    fetch("/auth/forgot", {method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({email: email})})
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function () {
        $("msg").textContent =
          "If that address has an account, the link is on its way. Check spam too.";
      })
      .catch(function () {
        $("go").disabled = false;
        $("msg").textContent = "Could not reach the server. Try again.";
      });
  }
  $("go").addEventListener("click", submit);
  $("email").addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
})();
</script>
</body>
</html>
