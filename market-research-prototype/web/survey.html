<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Intake survey · Castor Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="/brand.css">
<style>
  /* [hidden] is a UA rule and ANY author `display:` beats it. .google set
     display:flex, so "Continue with Google" rendered on every install and 404'd
     wherever OAuth was unconfigured — the exact failure its own comment claims to
     prevent. One rule, so the next element to carry `hidden` is safe by default. */
  [hidden] { display: none !important; }

  /* The workspace's palette, verbatim: warm paper, emerald verdict accent. The survey is
     the front door of the same document the report becomes, so it speaks the same
     language. See web/workspace.html for the provenance of these values. */
  :root {
    --bg: var(--brand-paper);
    --surface: var(--brand-surface);
    --surface-2: var(--brand-surface-2);
    --line: var(--brand-line);
    --text: var(--brand-ink);
    --text-dim: var(--brand-ink-dim);
    --text-faint: var(--brand-ink-faint);
    --shadow-1: var(--brand-shadow);
    --shadow-2: 0 2px 4px oklch(30% 0.02 85 / .06), 0 14px 36px -12px oklch(30% 0.02 85 / .16);
    --accent: var(--brand-accent-ink);
    --accent-soft: var(--brand-accent-bg);
    --ok: oklch(60% 0.16 155);
    --warn-ink: var(--brand-warn);
    --warn-bg: var(--brand-warn-bg);
    --warn-line: var(--brand-warn-line);
    --radius: var(--brand-r);
    --serif: var(--brand-sans);
    --sans: var(--brand-sans);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: oklch(48.5% 0.105 163.5 / .18); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  body {
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* ---- chrome ------------------------------------------------------------------ */
  .rail {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 13px 24px; background: oklch(97.3% 0.006 85 / .88);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .brand { font-family: var(--serif); font-size: 16px; font-weight: var(--brand-display-weight);
           letter-spacing: -.01em; text-decoration: none; color: var(--text); }
  .brand span { color: var(--accent); }
  .steps { display: flex; gap: 4px; margin-left: auto; align-items: center; }
  /* The dashboard links here as "New report"; without the reciprocal link the front
     door was a one-way street and a returning reader could not reach their library. */
  .rail-lib { font-size: 13px; font-weight: 600; text-decoration: none; padding: 7px 13px;
              border-radius: 9px; border: 1px solid var(--line); color: var(--text-dim);
              background: var(--surface); white-space: nowrap; }
  .rail-lib:hover { border-color: var(--accent); color: var(--accent); }
  .step-dot {
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-faint); padding: 4px 10px; border-radius: 999px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .step-dot.on { color: var(--accent); background: var(--accent-soft);
                 border-color: color-mix(in srgb, var(--accent) 22%, transparent); }
  .step-dot.done { color: var(--text-dim); }

  /* ---- page -------------------------------------------------------------------- */
  main { max-width: 1080px; margin: 0 auto; padding: 44px 24px 140px; }
  .lede { max-width: 660px; margin-bottom: 34px; }
  .lede h1 { font-family: var(--serif); font-size: clamp(26px, 1.4rem + 1.6vw, 38px);
             font-weight: var(--brand-display-weight); letter-spacing: -.02em; line-height: 1.15; }
  .lede p { margin-top: 12px; font-size: 15px; color: var(--text-dim); max-width: 56ch; }

  /* The editorial gutter: the question number sits in the left margin and the "what this
     decides" note in the right, so the founder reads a form and an argument for it at the
     same time. Both collapse into the column below 900px. */
  .q {
    display: grid; grid-template-columns: 46px minmax(0, 1fr) 210px;
    gap: 0 22px; padding: 26px 0; border-top: 1px solid var(--line);
  }
  .q:first-of-type { border-top: none; }
  .q-num { font-family: var(--serif); font-size: 15px; color: var(--text-faint);
           padding-top: 1px; font-variant-numeric: tabular-nums; }
  .q-body { min-width: 0; }
  .q-ask { font-size: 15.5px; line-height: 1.45; letter-spacing: -.006em; }
  .q-opt { margin-left: 8px; font-size: 12px; color: var(--text-faint); font-style: italic; }
  .q-note {
    font-size: 12px; line-height: 1.5; color: var(--text-faint);
    padding-top: 3px; border-left: 2px solid var(--line); padding-left: 12px;
  }
  .q-note b { font-weight: 600; color: var(--text-dim); display: block;
              font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
              margin-bottom: 3px; }
  @media (max-width: 900px) {
    .q { grid-template-columns: 32px minmax(0, 1fr); }
    .q-note { grid-column: 2; margin-top: 12px; }
  }

  /* ---- controls ----------------------------------------------------------------- */
  .ctl { margin-top: 12px; }
  .txt, .num {
    font: inherit; font-size: 14px; color: inherit; width: 100%;
    padding: 10px 12px; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 9px;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  textarea.txt { resize: vertical; min-height: 84px; line-height: 1.5; }
  .num { width: 130px; }
  .txt:focus, .num:focus {
    outline: none; background: var(--surface); border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .row { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
  .unit {
    font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-dim); padding: 5px 9px;
    border: 1px solid var(--line); border-radius: 5px; background: var(--surface);
  }

  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  /* Visually hidden, NOT hidden. opacity:0 reads as hidden to assistive tech and the
     radios dropped out of the accessibility tree entirely: a sighted mouse user saw a
     choice, a screen reader saw nothing. The clip pattern keeps opacity at 1, so the
     control stays exposed and focusable, and :focus-visible below paints the ring on the
     pill the user can actually see. */
  .opt input {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
    white-space: nowrap; border: 0;
  }
  .opt span {
    display: inline-block; font-size: 13px; padding: 8px 14px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    transition: border-color .12s ease, background .12s ease, color .12s ease;
  }
  .opt span:hover { border-color: var(--accent);
                    background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .opt input:checked + span {
    border-color: var(--accent); font-weight: 600; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt--period span { font-size: 12px; padding: 6px 12px; }
  .opt--other span { border-style: dashed; }
  .writein { margin-top: 9px; display: none; }
  .writein.show { display: block; }

  .echo { margin-top: 9px; font-size: 12.5px; color: var(--text-dim); min-height: 1em; }
  .echo.ok { color: var(--accent); }
  .echo.bad { color: var(--warn-ink); }
  .ghost {
    font: inherit; font-size: 12.5px; cursor: pointer; color: var(--text-dim);
    padding: 7px 13px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px;
  }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .need { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-4px);} 75% { transform: translateX(4px);} }
  .hint { margin-top: 7px; font-size: 12px; color: var(--text-faint); }

  /* ---- stage 0: the description box --------------------------------------------- */
  .tell { max-width: 720px; }
  .tell textarea {
    font: inherit; font-size: 16px; line-height: 1.6; width: 100%; min-height: 230px;
    padding: 18px 20px; color: inherit; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-1); resize: vertical;
  }
  .tell textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .tell textarea.drop { border-color: var(--accent); background: var(--accent-soft); }
  .tools { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin-top: 12px; }
  .mic.rec { color: #fff; background: var(--warn-ink); border-color: var(--warn-ink); }
  .mic.rec:hover { color: #fff; }
  .count { margin-left: auto; font-size: 11.5px; color: var(--text-faint);
           font-variant-numeric: tabular-nums; }
  .examples { margin-top: 22px; }
  .ex-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
            text-transform: uppercase; color: var(--text-faint); margin-bottom: 9px; }
  .ex {
    font-size: 13.5px; line-height: 1.55; color: var(--text-dim); cursor: pointer;
    padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line);
    border-left: 2px solid var(--line); border-radius: 8px; margin-bottom: 8px;
    transition: border-color .12s ease, color .12s ease;
  }
  .ex:hover { border-left-color: var(--accent); color: var(--text); }
  .ex b { display: block; font-size: 11px; font-weight: 700; letter-spacing: .05em;
          text-transform: uppercase; color: var(--text-faint); margin-bottom: 4px; }

  /* ---- the reading, and what would decide it ------------------------------------ */
  .brief { max-width: 760px; margin-bottom: 30px; }
  .reading {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 9px;
    margin-bottom: 11px;
  }
  .reading-txt { font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
                 text-transform: uppercase; color: var(--text-faint); }
  .prov { font-size: 10px; font-weight: 600; border-radius: 6px; padding: 2px 7px; }
  .prov-stated { background: var(--accent-soft); color: var(--accent); }
  .prov-inferred { background: oklch(94% 0.03 250); color: oklch(48% 0.14 250); }
  .prov-assumed { background: oklch(95% 0.03 70); color: oklch(50% 0.12 70); }
  .reading .ctl { margin-top: 0; }
  .consequence { margin-top: 15px; font-size: 15px; line-height: 1.55;
                 color: var(--text); max-width: 58ch; }
  .decides { margin-top: 22px; }
  .dec-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
             text-transform: uppercase; color: var(--text-faint); margin-bottom: 11px; }
  .dec {
    display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px;
    padding: 13px 0; border-top: 1px solid var(--line);
  }
  .who {
    font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 0; text-align: center; border-radius: 5px; height: fit-content;
  }
  .who-us { background: var(--accent-soft); color: var(--accent); }
  .who-you { background: oklch(95% 0.03 70); color: oklch(50% 0.12 70); }
  .dec-q { font-size: 14.5px; line-height: 1.45; }
  .dec-how { margin-top: 3px; font-size: 12px; color: var(--text-faint); }

  /* ---- the reveal ---------------------------------------------------------------- */
  .reveal { max-width: 760px; }
  .stat {
    padding: 26px 28px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-2); margin-bottom: 14px;
  }
  .stat-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
              text-transform: uppercase; color: var(--text-faint); }
  .stat-big {
    margin-top: 9px; font-family: var(--serif); font-size: clamp(28px, 1.4rem + 2.2vw, 44px);
    font-weight: var(--brand-display-weight); letter-spacing: -.022em; line-height: 1.1;
  }
  .stat-sub { margin-top: 9px; font-size: 15px; line-height: 1.5; color: var(--text-dim);
              max-width: 52ch; }
  .workings {
    margin-top: 14px; padding-top: 13px; border-top: 1px dashed var(--line);
    font-size: 12.5px; color: var(--text-faint);
  }
  .workings b { font-weight: 600; color: var(--text-dim); }
  .bars { display: flex; height: 9px; margin-top: 16px; border-radius: 999px;
          overflow: hidden; background: var(--surface-2); }
  .bar-fill { background: var(--accent); }
  .bar-over { background: var(--warn-ink); }
  .limits {
    margin-top: 20px; padding: 16px 18px; border-radius: var(--radius);
    background: var(--warn-bg); border: 1px solid var(--warn-line);
  }
  .lim-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
             text-transform: uppercase; color: var(--warn-ink); margin-bottom: 9px; }
  .limits ul { margin: 0; padding-left: 17px; }
  .limits li { font-size: 13px; line-height: 1.55; color: var(--warn-ink);
               margin-bottom: 6px; }
  .limits li:last-child { margin-bottom: 0; }
  /* ---- the gate ------------------------------------------------------------------
     It is not a warning, so it does not borrow the warn palette. It is the moment of
     sale: a plain card that leads with the price and gets out of the way. */
  .gate {
    margin-top: 22px; padding: 24px 24px 20px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-2);
    display: flex; flex-direction: column; gap: 10px;
  }
  .gate-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
              text-transform: uppercase; color: var(--accent); }
  .gate-head { font-family: var(--serif); font-size: 20px; letter-spacing: -.014em;
               font-weight: var(--brand-display-weight); margin: 0; }
  .gate-sub { margin: 0 0 6px; font-size: 13.5px; line-height: 1.6; color: var(--text-dim);
              max-width: 56ch; }
  /* ---- picking, before paying ------------------------------------------------------
     A radio group that looks like cards. The native input is visually hidden rather than
     removed (see .opt above for why): arrow-key navigation and the screen-reader group
     semantics come free, and :checked still drives the paint. */
  .gate-opts { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
  .gate-opt {
    position: relative; display: grid; cursor: pointer;
    grid-template-columns: 22px 1fr auto; align-items: center; gap: 0 14px;
    padding: 14px 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface);
    transition: border-color .16s var(--ease), background .16s var(--ease),
                transform .16s var(--ease);
  }
  .gate-opt:hover { border-color: color-mix(in srgb, var(--brand-action) 45%, var(--line)); }
  .gate-opt.on {
    border-color: var(--brand-action); transform: translateY(-1px);
    background: color-mix(in srgb, var(--brand-action) 5%, var(--surface));
    box-shadow: 0 1px 0 var(--brand-action) inset, 0 0 0 1px var(--brand-action);
  }
  .gate-opt.busy { opacity: .55; cursor: default; }
  .gate-opt-radio {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); border: 0;
  }
  .gate-tick {
    width: 20px; height: 20px; border-radius: 999px; display: inline-block;
    border: 1.5px solid var(--line); background: var(--surface);
    transition: border-color .16s var(--ease), background .16s var(--ease);
  }
  .gate-opt.on .gate-tick {
    border-color: var(--brand-action); background: var(--brand-action);
    box-shadow: inset 0 0 0 3.5px var(--surface);
  }
  .gate-opt-radio:focus-visible ~ .gate-tick { outline: 2px solid var(--accent);
                                               outline-offset: 2px; }
  .gate-opt-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .gate-opt-name { font-size: 14.5px; font-weight: 600; }
  .gate-opt-note { font-size: 11.5px; color: var(--text-faint); }
  .gate-opt-price { font-size: 17px; font-weight: 700; letter-spacing: -.015em;
                    font-variant-numeric: tabular-nums; }
  .gate-flag {
    position: absolute; top: -8px; right: 14px; padding: 2px 8px; border-radius: 999px;
    font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    background: var(--brand-action); color: #fff;
  }

  /* ---- the moment they paid --------------------------------------------------------
     A receipt says a transaction happened. This says something good happened, which is
     the truthful reading: they have just committed money to a stranger's website. */
  .gate.celebrate { align-items: flex-start; }
  .gate-seal { color: var(--brand-action); margin-bottom: 2px; transform-origin: 26px 26px; }
  .gate-seal .seal-ring { stroke: currentColor; opacity: .28; }
  .gate-seal .seal-tick { stroke: currentColor; }
  .gate-head-big { font-size: 24px; letter-spacing: -.02em; }
  .gate-rule { height: 1px; background: var(--line); margin: 14px 0 4px; align-self: stretch; }

  /* THE FINISHED STATE IS THE DEFAULT, and the animation only plays it in.
     Written the other way round first: the undrawn dash offsets lived on the ELEMENT and
     the keyframes drew them to zero. That renders a checkmark nobody can see anywhere the
     animation does not run — a paused background tab, a print, a screenshot pipeline, an
     engine that skipped it. The mark is the whole point of the card, so it must not depend
     on a flourish completing. The dash values live in the keyframes now: animation plays,
     it draws itself; animation never plays, it was already drawn.

     Same reasoning kills the staggered fade that was here. `animation-fill-mode: both`
     with a delay holds opacity 0 BEFORE the animation starts, so a card that never
     animates stays invisible. One transform on the whole card, no delay, nothing to be
     stuck behind. */
  /* MOTION HERE IS PURELY ADDITIVE: it may only move things, never reveal them.
     Two earlier versions of this hid their own content. The first put the undrawn dash
     offsets on the element, so the checkmark existed only once the animation finished.
     The second animated the card from opacity 0. Both are fine while animations run, and
     both render a blank or markless card anywhere they do not — MEASURED in this very
     browser pane, where animations start and then never advance: every element froze on
     frame one and the whole card computed opacity 0.

     A background tab, a print stylesheet, a screenshot service, a throttled renderer and
     a paused compositor all do this. So the resting state is now the finished state, and
     the only animated property is `transform`. Frozen on frame one, the card is a few
     pixels low and the seal is slightly small. Both are legible, which is the bar. */
  @media (prefers-reduced-motion: no-preference) {
    .gate.celebrate { animation: seal-rise .4s var(--ease); }
    .gate-seal { animation: seal-pop .45s var(--ease); }
  }
  @keyframes seal-rise { from { transform: translateY(10px); } }
  @keyframes seal-pop  { from { transform: scale(.72) rotate(-8deg); } }

  .gate-buy {
    display: grid; grid-template-columns: 1fr auto; align-items: baseline;
    gap: 2px 14px; width: 100%; text-align: left; cursor: pointer;
    padding: 13px 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface);
    color: var(--text); font: inherit;
    transition: border-color .18s var(--ease), background .18s var(--ease),
                transform .18s var(--ease);
  }
  .gate-buy:hover:not(:disabled) { border-color: var(--brand-action); transform: translateY(-1px); }
  .gate-buy:disabled { opacity: .6; cursor: default; }
  .gate-buy.primary { background: var(--brand-action); border-color: var(--brand-action);
                      color: #fff; }
  .gate-buy.primary:hover:not(:disabled) { background: var(--brand-action-hi);
                                           border-color: var(--brand-action-hi); }
  .gate-buy-name { font-size: 14.5px; font-weight: 600; }
  .gate-buy-price { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .gate-buy-note { grid-column: 1 / -1; font-size: 11.5px; opacity: .72; margin-top: 2px; }
  .gate-field { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
  .gate-lab-sm { font-size: 11.5px; font-weight: 600; color: var(--text-dim); }
  .gate-input {
    width: 100%; max-width: 420px; padding: 10px 12px; font: inherit; font-size: 14px;
    color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .gate-input:focus { border-color: var(--brand-action); outline: none; }
  .gate-fine, .gate-alt { margin: 4px 0 0; font-size: 12.5px; line-height: 1.6;
                          color: var(--text-faint); }
  .gate-fine a, .gate-alt a { color: var(--accent); }
  /* In test mode this is the only working action on the card, so it is a button, not a
     footnote. It stays visually distinct from the priced buttons above it: an outline
     rather than a fill, because it is a way past the paywall and should never be mistaken
     for one of the things being sold. */
  .gate-skip {
    display: block; width: 100%; margin-top: 6px; padding: 12px 16px; text-align: left;
    border-radius: var(--radius); border: 1px solid var(--brand-action); cursor: pointer;
    background: var(--surface); color: var(--brand-action); font: inherit;
    transition: background .18s var(--ease), transform .18s var(--ease);
  }
  .gate-skip:hover:not(:disabled) {
    background: color-mix(in srgb, var(--brand-action) 7%, transparent);
    transform: translateY(-1px);
  }
  .gate-skip:disabled { opacity: .6; cursor: default; }
  /* A refusal, where the founder is actually looking: beside the button that caused it. */
  .gate-msg {
    margin: 2px 0 0; padding: 11px 14px; border-radius: var(--radius);
    background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink);
    font-size: 13px; line-height: 1.55;
  }
  .gate-preview {
    margin: 0 0 4px; padding: 10px 13px; border-radius: var(--radius);
    background: var(--surface-2); border: 1px dashed var(--line);
    color: var(--text-dim); font-size: 12.5px; line-height: 1.55;
  }
  .next {
    margin-top: 22px; padding: 20px 22px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface);
  }

  .bar {
